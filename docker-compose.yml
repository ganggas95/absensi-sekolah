services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: absensi
      POSTGRES_USER: absensi
      POSTGRES_PASSWORD: absensi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absensi -d absensi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+psycopg://absensi:absensi@db:5432/absensi
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGINS: https://${INTRANET_HOST:-intranet.bca.local}
      COOKIE_SECURE: "true"
      MEDIA_DIR: /app/uploads
    networks:
      - default
      - database
    volumes:
      - student_photos:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert/server.crt:/etc/nginx/certs/server.crt:ro
      - ./cert/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  student_photos:

networks:
  database:
    internal: true
